<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Pure Computers</title>
<link rel="icon" href="{{ site.baseurl }}/favicon.ico" type="image/x-icon">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;1,400&family=Montserrat:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap');
</style>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    padding-top: 56px;
  }

  /* ---------- top header: black strip + orange nav (Google Sites) ---------- */
  #site-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: #000;
    font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
  }
  #site-header .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    height: 56px;
    display: flex;
    align-items: center;
    background: #FFA000;
    padding: 0 20px;
  }
  #site-header .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #fff;
    font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
    font-size: 15px;
    font-weight: 500;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    flex-shrink: 0;
  }
  #site-header .logo .logo-box {
    width: 34px;
    height: 34px;
    background: #FFA000;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    border-radius: 3px;
    text-shadow: none;
  }
  #site-header .logo img {
    height: 34px;
    width: auto;
  }
  #site-header nav {
    display: flex;
    gap: 2px;
    margin-left: auto;
    align-items: center;
    flex-wrap: wrap;
  }
  #site-header nav a {
    display: inline-block;
    padding: 6px 14px;
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 400;
    border-radius: 3px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    transition: background 0.15s;
    white-space: nowrap;
  }
  #site-header nav a:hover {
    background: rgba(0,0,0,0.12);
  }
  #site-header nav a.active {
    background: rgba(87, 55, 0, 0.85);
    color: #fff;
    font-weight: 500;
  }

  /* ---------- main content (pure black canvas) ---------- */
  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 40px;
    min-height: calc(100vh - 56px);
    background: #000;
  }
  .page section {
    margin-bottom: 24px;
    padding: 18px 20px;
    background: #000;
  }
  .page section h1, .page section h2, .page section h3 {
    font-family: 'Montserrat', 'Google Sans', 'Roboto', sans-serif;
    margin-bottom: 10px;
    line-height: 1.25;
    color: #fff;
  }
  .page section p, .page section li {
    font-family: 'Roboto', Arial, sans-serif;
    line-height: 1.6;
    font-size: 15px;
    color: #dcdcdc;
  }
  .page section img {
    max-width: 100%;
    height: auto;
    display: block;
  }
  /* keep the original neon inline colors; ensure they read on black */
  .page section [style*="color: #ffffff"],
  .page section [style*="color:#ffffff"] { color: #ffffff !important; }
  .page section [style*="color: #000000"],
  .page section [style*="color:#000000"] { color: #e0e0e0 !important; }

  /* ---------- footer ---------- */
  .site-footer {
    background: #000;
    border-top: 1px solid #222;
    padding: 20px 32px;
    text-align: center;
    font-family: 'Roboto', Arial, sans-serif;
    color: #e6e3df;
    font-size: 13px;
  }
  .site-footer a { color: #3399ff; text-decoration: underline; }
</style>
</head>
<body>

<div id="site-header">
  <div class="header-inner">
    <a class="logo" href="{{ site.baseurl }}/">
      <span class="logo-box">PURE</span>
      <span>Pure Computers</span>
    </a>
    <nav class="pc-menu">
      <a href="{{ site.baseurl }}/pages/pc-home.html" class="{% if page.title == 'Pure Computers' %}active{% endif %}">PC-Home</a>
      <a href="{{ site.baseurl }}/pages/get-help-now.html">Get Help Now!</a>
      <a href="{{ site.baseurl }}/pages/about-us.html" class="{% if page.title == 'About Us' %}active{% endif %}">About Us</a>
      <a href="{{ site.baseurl }}/pages/services.html" class="{% if page.title == 'Services' %}active{% endif %}">Services</a>
      <a href="{{ site.baseurl }}/pages/form.html">Form</a>
      <a href="{{ site.baseurl }}/pages/more-game.html">More</a>
      <a href="{{ site.baseurl }}/pages/referral-program.html">Referral Program</a>
      <a href="{{ site.baseurl }}/pages/privacyterms-disclaimers.html">Privacy/Terms</a>
    </nav>
  </div>
</div>

<main class="page">
  {{ content }}
</main>

<footer class="site-footer">
  <p style="margin:6px 0;">
    <a href="tel:5854841764" style="color:#3399ff; font-weight:700;">{Call 585-484-1764}</a>
    &nbsp;
    <a href="{{ site.baseurl }}/pages/privacyterms-privacy-policy.html">Privacy Policy</a>
    &nbsp;
    <a href="mailto:PureComproc@gmail.com">Email Us</a>
  </p>
  <p style="margin:0;">2024-PURECOMPUTERS</p>
</footer>

</body>
</html>
