t;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;color: rgb(127, 127, 127);&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89); font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;In some cases we may use cookies to collect personal information, or that becomes personal information if we combine it with other information.&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;color: rgb(127, 127, 127);&quot;&gt;&lt;span style=&quot;color: rgb(0, 0, 0); font-size: 15px;&quot;&gt;&lt;strong&gt;&lt;span data-custom-class=&quot;heading_1&quot;&gt;What are cookies?&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;color: rgb(127, 127, 127);&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89); font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;Cookies are small data files that are placed on your computer or mobile device when you visit a website. Cookies are widely used by website owners in order to make their websites work, or to work more efficiently, as well as to provide reporting information.&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;color: rgb(127, 127, 127);&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89); font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;Cookies set by the website owner (in this case, &lt;bdt class=&quot;question&quot;&gt;Pure Computers&lt;/bdt&gt;) are called &quot;first-party cookies.&quot; Cookies set by parties other than the website owner are called &quot;third-party cookies.&quot; Third-party cookies enable third-party features or functionality to be provided on or through the website (e.g., advertising, interactive content, and analytics). The parties that set these third-party cookies can recognize your computer both when it visits the website in question and also when it visits certain other websites.&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;color: rgb(127, 127, 127);&quot;&gt;&lt;span style=&quot;color: rgb(0, 0, 0); font-size: 15px;&quot;&gt;&lt;strong&gt;&lt;span data-custom-class=&quot;heading_1&quot;&gt;Why do we use cookies?&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;color: rgb(127, 127, 127);&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89); font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;We use first-&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt; and third-&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt;party cookies for several reasons. Some cookies are required for technical reasons in order for our Website to operate, and we refer to these as &quot;essential&quot; or &quot;strictly necessary&quot; cookies. Other cookies also enable us to track and target the interests of our users to enhance the experience on our Online Properties. &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;Third parties serve cookies through our Website for advertising, analytics, and other purposes. &lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt;This is described in more detail below.&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;colo m-class=&quot;body_text&quot;&gt;If you do not want Flash Cookies stored on your computer, you can adjust the settings of your Flash player to block Flash Cookies storage using the tools contained in the &lt;/span&gt;&lt;/span&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;color: rgb(0, 58, 250);&quot;&gt;&lt;a data-custom-class=&quot;link&quot; href=&quot;http://www.macromedia.com/support/documentation/en/flashplayer/help/settings_manager07.html&quot; target=&quot;_BLANK&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;Website Storage Settings Panel&lt;/span&gt;&lt;/a&gt;&lt;/span&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;. You can also control Flash Cookies by going to the &lt;/span&gt;&lt;span style=&quot;color: rgb(0, 58, 250);&quot;&gt;&lt;a data-custom-class=&quot;link&quot; href=&quot;http://www.macromedia.com/support/documentation/en/flashplayer/help/settings_manager03.html&quot; target=&quot;_BLANK&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;Global Storage Settings Panel&lt;/span&gt;&lt;/a&gt;&lt;/span&gt;&lt;/span&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt; and &lt;/span&gt;&lt;span style=&quot;font-size:15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;following the instructions (which may include instructions that explain, for example, how to delete existing Flash Cookies (referred to &quot;information&quot; on the Macromedia site), how to prevent Flash LSOs from being placed on your computer without your being asked, and (for Flash Player 8 and later) how to block Flash Cookies that are not being delivered by the operator of the page you are on at the time).&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size:
