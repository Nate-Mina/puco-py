t;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;strong&gt;&lt;em&gt;In Short: &lt;/em&gt;&lt;/strong&gt;&lt;em&gt;We aim to protect your personal information through a system of &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;organizational&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; and technical security measures.&lt;/em&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;We have implemented appropriate and reasonable technical and &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;organizational&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; security measures designed to protect the security of any personal information we process. However, despite our safeguards and efforts to secure your information, no electronic transmission over the Internet or information storage technology can be guaranteed to be 100% secure, so we cannot promise or guarantee that hackers, cybercriminals, or other &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;unauthorized&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; third parties will not be able to defeat our security and improperly collect, access, steal, or modify your information. Although we will do our best to protect your personal information, transmission of personal information to and from our Services is at your own risk. You should only access the Services within a secure environment.&lt;span style=&quot;color: rgb(89, 89, 89);&quot;&gt;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;span style=&quot;color: rgb(89, 89, 89); font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div id=&quot;infominors&quot; style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;color: rgb(127, 127, 127);&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89); font-size: 15px;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span id=&quot;control&quot; style=&quot;color: rgb(0, 0, 0);&quot;&gt;&lt;strong&gt;&lt;span data-custom-class=&quot;heading_1&quot;&gt;9. DO WE COLLECT INFORMATION FROM MINORS?&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;strong&gt;&lt;em&gt;In Short:&lt;/em&gt;&lt;/strong&gt;&lt;em&gt; We do not knowingly collect data from or market to &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;children under 18 years of age&lt;bdt class=&quot;else-block&quot;&gt;&lt;/bdt&gt;.&lt;/em&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;We do not knowingly solicit data from or market to children under 18 years of age. By using the Services, you represent that you are at least 18 or that you are the parent or guardian of such a minor and consent to such minor dependent’s use of the Services. If we learn that personal information from users less than 18 years of age has been collected, we will deactivate the account and take reasonable measures to promptly delete such data from our records. If you become aware of any data we may have collected from children under age 18, please contact us at &lt;span style=&quot;color: rgb(89, 89, 89); font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;bdt class=&quot;question&quot;&gt;PureComproc@gmail.com&lt;/bdt&gt;&lt;bdt class=&quot;else-block&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;.&lt;/span&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;bdt class=&quot;else-block&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div id=&quot;privacyrights&quot; style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;color: rgb(127, 127, 127);&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89); font-size: 15px;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span id=&quot;control&quot; style=&quot;color: rgb(0, 0, 0);&quot;&gt;&lt;strong&gt;&lt;span data-custom-class=&quot;heading_1&quot;&gt;10. WHAT ARE YOUR PRIVACY RIGHTS?&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;strong&gt;&lt;em&gt;In Short:&lt;/em&gt;&lt;/strong&gt;&lt;em&gt; &lt;span style=&quot;color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;em&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;/em&gt;&lt;/span&gt;&lt;/span&gt; &lt;/span&gt;You may review, change, or terminate your account at any time.&lt;/em&gt;&lt;span style=&quot;color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div id=&quot;withdrawconsent&quot; style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;strong&gt;&lt;u&gt;Withdrawing your consent:&lt;/u&gt;&lt;/strong&gt; If we are relying on your consent to process your personal information,&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt; which may be express and/or implied consent depending on the applicable law,&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; you have the right to withdraw your consent at any time. You can withdraw your consent at any time by contacting us by using the contact details provided in the section &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&quot;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;a data-custom-class=&quot;link&quot; href=&quot;#contact&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(0, 58, 250);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(0, 58, 250);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;HOW CAN YOU CONTACT US ABOUT THIS NOTICE?&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&quot;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; below&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;.&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;However, please note that this will not affect the lawfulness of the processing before its withdrawal nor,&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt; when applicable law allows,&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; will it affect the processing of your personal information conducted in reliance on lawful processing grounds other than consent.&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;strong&gt;&lt;u&gt;Opting out of marketing and promotional communications:&lt;/u&gt;&lt;/strong&gt;&lt;strong&gt;&lt;u&gt; &lt;/u&gt;&lt;/strong&gt;You can unsubscribe from our marketing and promotional communications at any time by&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt; or by contacting us using the details provided in the section &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&quot;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;a data-custom-class=&quot;link&quot; href=&quot;#contact&quot;&gt;&lt;span style=&quot;color: rgb(0, 58, 250); font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;HOW CAN YOU CONTACT US ABOUT THIS NOTICE?&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&quot;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; below. You will then be removed from the marketing lists. However, we may still communicate with you — for example, to send you service-related messages that are necessary for the administration and use of your account, to respond to service requests, or for other non-marketing purposes.&lt;/span&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/bdt&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;heading_2&quot;&gt;&lt;strong&gt;Account Information&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;If you would at any time like to review or change the information in your account or terminate your account, you can:&lt;bdt class=&quot;forloop-component&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;ul&gt;&lt;li data-custom-class=&quot;body_text&quot; style=&quot;line-height: 1.5;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;bdt class=&quot;question&quot;&gt;Contact us using the contact information provided.&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;bdt class=&quot;forloop-component&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;Upon your request to terminate your account, we will deactivate or delete your account and information from our active databases. However, we may retain some information in our files to prevent fraud, troubleshoot problems, assist with any investigations, enforce our legal terms and/or comply with applicable legal requirements.&lt;/span&gt;&lt;/span&gt;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/bdt&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89);&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;strong&gt;&lt;u&gt;Cookies and similar technologies:&lt;/u&gt;&lt;/strong&gt; Most Web browsers are set to accept cookies by default. If you prefer, you can usually choose to set your browser to remove cookies and to reject cookies. If you choose to remove cookies or reject cookies, this could affect certain features or services of our Services. &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;You may also &lt;span style=&quot;color: rgb(0, 58, 250);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;a data-custom-class=&quot;link&quot; href=&quot;http://www.aboutads.info/choices/&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;&gt;&lt;span style=&quot;color: rgb(0, 58, 250); font-size: 15px;&quot;&gt;opt out of interest-based advertising by advertisers&lt;/span&gt;&lt;/a&gt;&lt;/span&gt;&lt;/span&gt; on our Services. &lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;For further information, please see our Cookie Notice: &lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;color: rgb(0, 58, 250);&quot;&gt;&lt;bdt class=&quot;question&quot;&gt;&lt;a href=&quot;https://www.purecomp.net/cookies&quot; target=&quot;_blank&quot; data-custom-class=&quot;link&quot;&gt;https://www.purecomp.net/cookies&lt;/a&gt;&lt;/bdt&gt;&lt;/span&gt;.&lt;bdt class=&quot;block-component&quot; &lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;We may disclose your personal information with our service providers pursuant to a written contract between us and each service provider. Learn more about how we disclose personal information to in the section, &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&quot;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;a data-custom-class=&quot;link&quot; href=&quot;#whoshare&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(0, 58, 250);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(0, 58, 250);&quot;&gt;WHEN AND WITH WHOM DO WE SHARE YOUR PERSONAL INFORMATION?&lt;/span&gt;&lt;/span&gt;&lt;/a&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&quot;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;We may use your personal information for our own business purposes, such as for undertaking internal research for technological development and demonstration. This is not considered to be &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&quot;selling&quot;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; of your personal information.&lt;span style=&quot;color: rgb(89, 89, 89); font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;We have not disclosed, sold, or shared any personal information to third parties for a business or commercial purpose in the preceding twelve (12) months. We&lt;span style=&quot;color: rgb(89, 89, 89);&quot;&gt; &lt;/span&gt;will not sell or share personal information in the future belonging to website visitors, users, and other consumers.&lt;span style=&quot;color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;color: rgb(0, 0, 0);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;strong&gt;&lt;span data-custom-class=&quot;heading_2&quot; style=&quot;font-size: 15px;&quot;&gt;California Residents&lt;/span&gt;&lt;/strong&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot; style=&quot;font-size: 15px;&quot;&gt;California Civil Code Section 1798.83, also known as the &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&quot;Shine The Light&quot;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; law permits our users who are California residents to request and obtain from us, once a year and free of charge, information about categories of personal information (if any) we disclosed to third parties for direct marketing purposes and the names and addresses of all third parties with which we shared personal information in the immediately preceding calendar year. If you are a California resident and would like to make such a request, please submit your request in writing to us using the contact information provided below.&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;br&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot; style=&quot;font-size: 15px;&quot;&gt;If you are under 18 years of age, reside in California, and have a registered account with the Services, you have the right to request removal of unwanted data that you publicly post on the Services. To request removal of such data, please contact us using the contact information provided below and include the email address associated with your account and a statement that you reside in California. We will make sure the data is not publicly displayed on the Services, but please be aware that the data may not be completely or comprehensively removed from all our systems (e.g.&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;,&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; backups, etc.).&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;br&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;strong&gt;&lt;u&gt;CCPA Privacy Notice&lt;/u&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;br&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;This section applies only to California residents. Under the California Consumer Privacy Act (CCPA), you have the rights listed below.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;br&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;The California Code of Regulations defines a &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&quot;residents&quot;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; as:&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;br&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;margin-left: 20px; line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;(1) every individual who is in the State of California for other than a temporary or transitory purpose and&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;margin-left: 20px; line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;(2) every individual who is domiciled in the State of California who is outside the State of California for a temporary or transitory purpose&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;br&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;All other individuals are defined as &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&quot;non-residents.&quot;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;br&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;If this definition of &lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&quot;resident&quot;&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; applies to you, we must adhere to certain rights and obligations regarding your personal information.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line- lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;u&gt;Verification process&lt;/u&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;Upon receiving your request, we will need to verify your identity to determine you are the same person about whom we have the information in our system. These verification efforts require us to ask you to provide information so that we can match it with information you have previously provided us. For instance, depending on the type of request you submit, we may ask you to provide certain information so that we can match the information you provide with the information we already have on file, or we may contact you through a communication method (e.g.&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;,&lt;bdt class=&quot;statement-end-if-in-editor&quot;&gt;&lt;/bdt&gt; phone or email) that you have previously provided to us. We may also use other verification methods as the circumstances dictate.&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;We will only use personal information provided in your request to verify your identity or authority to make the request. To the extent possible, we will avoid requesting additional information from you for the purposes of verification. However, if we cannot verify your identity from the information already maintained by us, we may request that you provide additional information for the purposes of verifying your identity and for security or fraud-prevention purposes. We will delete such additionally provided information as soon as we finish verifying you.&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;br&gt;&lt;/div&gt;&lt;div style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;u&gt;Other privacy rights&lt;/u&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;span style=&quot;color: rgb(89, 89, 89); font-size: 15px;&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;&lt;bdt class=&quot;block-component&quot;&gt;&lt;/bdt&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;ul&gt;&lt;li data-custom-class=&quot;body_text&quot; style=&quot;line-height: 1.5;&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span data-custom-class=&quot;body_text&quot;&gt;You may object to the processing of your personal information.&lt;span style=&quot;font-size: 15px; color: rgb(89, 89, 89);&quot;&gt;&lt;span sty
